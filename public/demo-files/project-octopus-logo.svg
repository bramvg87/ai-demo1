<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" role="img" aria-label="Project Octopus logo">
  <title>Project Octopus</title>

  <!-- Mark: a hub (octopus head) with tentacles linking to connected system nodes -->
  <g id="mark">
    <!-- tentacles (connections to other systems) -->
    <g fill="none" stroke="#17B8C9" stroke-width="7" stroke-linecap="round">
      <path d="M68 116 C 54 138, 46 150, 40 162" />
      <path d="M82 121 C 73 149, 67 165, 68 177" />
      <path d="M100 123 C 100 152, 100 168, 100 183" />
      <path d="M118 121 C 127 149, 133 165, 132 177" />
      <path d="M132 116 C 146 138, 154 150, 160 162" />
    </g>
    <!-- connected system nodes -->
    <g fill="#17B8C9">
      <circle cx="40" cy="162" r="8" />
      <circle cx="68" cy="177" r="8" />
      <circle cx="100" cy="183" r="8" />
      <circle cx="132" cy="177" r="8" />
      <circle cx="160" cy="162" r="8" />
    </g>
    <!-- head (the hub) -->
    <circle cx="100" cy="80" r="44" fill="#1466E0" />
    <!-- eyes -->
    <circle cx="85" cy="74" r="8" fill="#FFFFFF" />
    <circle cx="115" cy="74" r="8" fill="#FFFFFF" />
    <circle cx="87" cy="75" r="3.4" fill="#0A2540" />
    <circle cx="117" cy="75" r="3.4" fill="#0A2540" />
  </g>

  <!-- Wordmark -->
  <g id="wordmark" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="205" y="92" font-size="42" fill="#0A2540">Project</text>
    <text x="205" y="138" font-size="42" fill="#1466E0">Octopus</text>
  </g>
</svg>
