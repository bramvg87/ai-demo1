<text x="335.0" y="158.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0E2233">Better</text>
<text x="335.0" y="178.0" text-anchor="middle" font-size="11.5" fill="#5A6B7B">higher quality,</text>
<text x="335.0" y="193.0" text-anchor="middle" font-size="11.5" fill="#5A6B7B">same effort</text>
<text x="525.0" y="150.0" text-anchor="middle" font-size="15" fill="#E8552F">&#9733;</text>
<text x="525.0" y="172.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0A2540">Faster AND better</text>
<text x="525.0" y="191.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0E9DB0">the goal</text>
<text x="335.0" y="342.0" text-anchor="middle" font-size="13" font-weight="600" fill="#5A6B7B">Low value</text>
