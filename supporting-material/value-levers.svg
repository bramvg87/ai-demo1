<text x="430.0" y="468" text-anchor="middle" font-size="13" font-weight="600" fill="#0E2233">more efficient: faster, with less input</text>
<text x="218" y="254.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0E2233" transform="rotate(-90 218 254.0)">more effective: better outcome</text>
<text x="410.0" y="484" text-anchor="middle" font-size="12" fill="#5A6B7B">With AI, most tasks move right (faster) or up (better). The win is to push for both.</text>
