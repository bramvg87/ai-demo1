<text x="525.0" y="373.0" text-anchor="middle" font-size="11.5" fill="#5A6B7B">less time and input</text>
<line x1="240" y1="434" x2="240" y2="58" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ax)"/>
